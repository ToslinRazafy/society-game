<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Plateau de jeu de propriété, vue de dessus">
  <rect width="400" height="400" rx="18" fill="#0b2e1a"/>
  <rect x="10" y="10" width="380" height="380" rx="12" fill="#a8d5b3"/>
  <g fill="#cfe8d2" stroke="#0b2e1a" stroke-width="2">
    <!-- anneau de cases -->
    <rect x="10" y="10" width="380" height="380" rx="12"/>
  </g>
  <g id="ring">
    <path d="M0 0" />
  </g>
  <!-- cases générées par groupe -->
  <g stroke="#0b2e1a" stroke-width="1.5">
    <!-- bas (0..10) -->
    <rect x="350" y="330" width="40" height="60" fill="#f5f0dc"/>
    <rect x="310" y="330" width="40" height="60" fill="#cfe8d2"/><rect x="270" y="330" width="40" height="60" fill="#955436"/><rect x="230" y="330" width="40" height="60" fill="#f5f0dc"/><rect x="190" y="330" width="40" height="60" fill="#cfe8d2"/><rect x="150" y="330" width="40" height="60" fill="#955436"/><rect x="110" y="330" width="40" height="60" fill="#f5f0dc"/><rect x="70" y="330" width="40" height="60" fill="#AAE0FA"/><rect x="30" y="330" width="40" height="60" fill="#cfe8d2"/>
    <rect x="10" y="330" width="20" height="60" fill="#0b2e1a"/>
    <rect x="10" y="330" width="60" height="60" fill="#0b2e1a"/>
    <rect x="10" y="330" width="60" height="60" fill="#0b2e1a"/>
    <rect x="330" y="330" width="60" height="60" fill="#0b2e1a"/>
    <rect x="10" y="10" width="60" height="60" fill="#0b2e1a"/>
    <rect x="330" y="10" width="60" height="60" fill="#0b2e1a"/>

    <!-- gauche (10..20) -->
    <rect x="10" y="290" width="60" height="40" fill="#D93A96"/><rect x="10" y="250" width="60" height="40" fill="#cfe8d2"/><rect x="10" y="210" width="60" height="40" fill="#D93A96"/><rect x="10" y="170" width="60" height="40" fill="#f5f0dc"/><rect x="10" y="130" width="60" height="40" fill="#D93A96"/><rect x="10" y="90" width="60" height="40" fill="#cfe8d2"/><rect x="10" y="50" width="60" height="40" fill="#F7941D"/>

    <!-- haut (20..30) -->
    <rect x="70" y="10" width="40" height="60" fill="#F7941D"/><rect x="110" y="10" width="40" height="60" fill="#cfe8d2"/><rect x="150" y="10" width="40" height="60" fill="#F7941D"/><rect x="190" y="10" width="40" height="60" fill="#f5f0dc"/><rect x="230" y="10" width="40" height="60" fill="#ED1B24"/><rect x="270" y="10" width="40" height="60" fill="#cfe8d2"/><rect x="310" y="10" width="40" height="60" fill="#ED1B24"/>

    <!-- droite (30..39) -->
    <rect x="330" y="70" width="60" height="40" fill="#ED1B24"/><rect x="330" y="110" width="60" height="40" fill="#cfe8d2"/><rect x="330" y="150" width="60" height="40" fill="#FEF200"/><rect x="330" y="190" width="60" height="40" fill="#f5f0dc"/><rect x="330" y="230" width="60" height="40" fill="#FEF200"/><rect x="330" y="270" width="60" height="40" fill="#cfe8d2"/><rect x="330" y="310" width="60" height="20" fill="#FEF200"/>

    <!-- coins verts -->
    <rect x="10" y="330" width="60" height="60" fill="#1FB25A"/>
    <rect x="330" y="330" width="60" height="60" fill="#f5f0dc"/>
    <rect x="330" y="10" width="60" height="60" fill="#0072BB"/>
  </g>
  <rect x="80" y="80" width="240" height="240" rx="10" fill="#0b2e1a"/>
  <text x="200" y="205" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#f5e6b8" text-anchor="middle" letter-spacing="6">MONOPOLY</text>
  <text x="200" y="230" font-family="Georgia, serif" font-size="11" fill="#a8d5b3" text-anchor="middle" letter-spacing="3">ÉDITION FRANÇAISE</text>
  <circle cx="120" cy="355" r="7" fill="#E4002B"/>
  <circle cx="140" cy="355" r="7" fill="#00A651"/>
</svg>
